# docker-compose.yml

services:
  backend:
    build:
      context: ./artback
      target: ${TARGET:-development}
    container_name: artback
    restart: unless-stopped
    volumes:
      - ./artback:/artback
      - static_volume:/artback/staticfiles
      - media_volume:/artback/media
      - sqlite_data:/artback
    environment:
      - DJANGO_ENV=${DJANGO_ENV:-development}
      - ENVIRONMENT=${ENVIRONMENT:-dev}
      - DJANGO_SECRET_KEY=${DJANGO_SECRET_KEY:-dev_secret_key}
      - DEBUG=${DEBUG:-True}
      - ALLOWED_HOSTS=${ALLOWED_HOSTS:-localhost,127.0.0.1,kichakapoa.com,www.kichakapoa.com}
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:-http://localhost:5173,http://localhost:80,https://kichakapoa.com}
    networks:
      - app_network
    expose:
      - 8000

  frontend:
    build:
      context: ./artfront
      target: ${TARGET:-development}
    container_name: artfront
    restart: unless-stopped
    volumes:
      - ./artfront:/artfront
      - /artfront/node_modules
      - ./artfront/dist:/artfront/dist
    environment:
      - NODE_ENV=${NODE_ENV:-development}
      - VITE_API_URL=${VITE_API_URL:-http://localhost}
    depends_on:
      - backend
    networks:
      - app_network
    expose:
      - 5173
    # Development only
    ports:
      - "5173:5173"
    # Use conditional command based on environment
    command: >
      sh -c '
      if [ "${TARGET}" = "production" ] || [ "${ENVIRONMENT}" = "prod" ]; then
        echo "Running in production mode";
        # Just keep container running without running npm
        tail -f /dev/null;
      else
        npm run dev;
      fi'

  nginx:
    image: nginx:alpine
    container_name: nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - static_volume:/var/www/static
      - media_volume:/var/www/media
      - ./artfront/dist:/var/www/html:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - /var/www/certbot:/var/www/certbot
    depends_on:
      - backend
      - frontend
    networks:
      - app_network

networks:
  app_network:
    driver: bridge

volumes:
  static_volume:
  media_volume:
  sqlite_data: