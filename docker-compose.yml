services:
  backend:
    build: 
      context: ./artback
    volumes:
      - ./artback:/artback
      - static_volume:/artback/staticfiles
      - sqlite_data:/artback/data
    expose:
      - "8000"
    environment:
      - DJANGO_ENV=${DJANGO_ENV:-development}
    tty: true
    stdin_open: true

  frontend:
    build: 
      context: ./artfront
      target: builder
      args:
        - NODE_ENV=${NODE_ENV:-development}
    volumes:
      - ./artfront:/artfront:delegated
      - /artfront/node_modules
    expose:
      - "5173"
    environment:
      - NODE_ENV=${NODE_ENV:-development}
      - CHOKIDAR_USEPOLLING=true

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d/default.conf:/etc/nginx/conf.d/default.conf:ro
      - static_volume:/artback/staticfiles
      - ./artfront/dist:/usr/share/nginx/html
    depends_on:
      - frontend
      - backend
    environment:
      - ENVIRONMENT=${ENVIRONMENT:-development}

volumes:
  static_volume:
  sqlite_data:
