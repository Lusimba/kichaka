services:
  frontend:
    ports:
      - "5173:5173"
    environment:
      - NODE_ENV=development
      - VITE_API_URL=http://localhost
    volumes:
      - ./artfront:/artfront
      - /artfront/node_modules

  backend:
    ports:
      - "8000:8000"
    environment:
      - DJANGO_ENV=development
      - DEBUG=1

  nginx:
    environment:
      - ENVIRONMENT=development
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/dev/default.conf:/etc/nginx/conf.d/default.conf:ro
      - static_volume:/artback/staticfiles
      - ./artfront/build:/var/www/artfront 