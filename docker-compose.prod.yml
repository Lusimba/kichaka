# docker-compose.prod.yml
services:
  frontend:
    environment:
      - NODE_ENV=production
      - VITE_API_URL=https://kichakapoa.com
    build:
      target: production
    # No volumes here in production - use the build from the Dockerfile

  backend:
    environment:
      - DJANGO_ENV=production
      - DEBUG=0

  nginx:
    environment:
      - ENVIRONMENT=production
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d/default.conf:/etc/nginx/conf.d/default.conf:ro
      - static_volume:/artback/staticfiles